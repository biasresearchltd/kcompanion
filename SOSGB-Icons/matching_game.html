<!DOCTYPE html>
<html>
<head>
    <title>Sprite Matching Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }

        .progress-bar {
            background: #333;
            border-radius: 20px;
            height: 24px;
            margin: 20px auto;
            max-width: 600px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            height: 100%;
            transition: width 0.3s;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 12px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 0.9em;
            color: #888;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button:hover { transform: translateY(-2px); }
        .controls button.primary { background: #4CAF50; color: white; }
        .controls button.secondary { background: #555; color: white; }
        .controls button.warning { background: #ff9800; color: white; }

        .game-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .match-card {
            background: #2a2a3e;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .sprite-preview.animate {
            animation: fadeIn 0.2s ease;
        }
        .match-option.animate {
            animation: fadeIn 0.15s ease;
        }

        .sprite-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .sprite-section h3 {
            color: #888;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .sprite-preview {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            display: inline-block;
        }
        .sprite-preview img {
            max-width: 120px;
            max-height: 120px;
        }
        .sprite-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .matches-section h3 {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .match-option {
            background: #1a1a2e;
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .match-option:hover {
            border-color: #4CAF50;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }
        .match-option.selected {
            border-color: #4CAF50;
            background: #1a2a1e;
        }
        .match-option img {
            max-width: 80px;
            max-height: 80px;
            background: #fff;
            border-radius: 8px;
            padding: 5px;
        }
        .match-option .name {
            margin-top: 10px;
            font-size: 11px;
            word-break: break-all;
            color: #ccc;
        }
        .match-option .score {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }
        .match-option .score-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .match-option .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
        }

        .no-match-btn {
            grid-column: 1 / -1;
            background: #3a3a4e;
            border: 2px dashed #555;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            color: #888;
            transition: all 0.2s;
        }
        .no-match-btn:hover {
            border-color: #ff9800;
            color: #ff9800;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        .action-buttons button {
            padding: 12px 30px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .action-buttons .confirm { background: #4CAF50; color: white; }
        .action-buttons .skip { background: #555; color: white; }

        .completed {
            text-align: center;
            padding: 60px;
        }
        .completed h2 {
            font-size: 2.5em;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        #export-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #export-modal.active { display: flex; }
        .modal-content {
            background: #2a2a3e;
            padding: 30px;
            border-radius: 16px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow: auto;
        }
        .modal-content h3 { margin-bottom: 20px; }
        .modal-content textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            font-size: 12px;
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .modal-content button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Sprite Matching Game</h1>
        <p>Match extracted game sprites to their names</p>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-text" id="progress-text">0 / 0</div>
    </div>

    <div class="stats">
        <div class="stat">

            <div class="stat-label">Matched</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="skipped-count">0</div>
            <div class="stat-label">Skipped</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="remaining-count">0</div>
            <div class="stat-label">Remaining</div>
        </div>
    </div>

    <div class="controls">
        <button class="secondary" onclick="goBack()">← Back (B)</button>
        <button class="secondary" onclick="jumpToUnmatched()">Jump to Unmatched</button>
        <button class="primary" onclick="exportMatches()">Export Matches</button>
        <button class="warning" onclick="exportRenameScript()">Export Rename Script</button>
    </div>

    <div class="game-container" id="game-container"></div>

    <div id="export-modal">
        <div class="modal-content">
            <h3 id="modal-title">Export</h3>
            <textarea id="export-text" readonly></textarea>
            <button style="background: #4CAF50; color: white;" onclick="copyExport()">Copy to Clipboard</button>
            <button style="background: #555; color: white;" onclick="closeModal()">Close</button>
        </div>
    </div>

        // Load saved state
        let matches = JSON.parse(localStorage.getItem('spriteMatches') || '{}');
        let skipped = new Set(JSON.parse(localStorage.getItem('spriteSkipped') || '[]'));
        let currentIndex = parseInt(localStorage.getItem('spriteCurrentIndex') || '0');

        let selectedMatch = null;

        function saveState() {
            localStorage.setItem('spriteMatches', JSON.stringify(matches));
            localStorage.setItem('spriteSkipped', JSON.stringify([...skipped]));
            localStorage.setItem('spriteCurrentIndex', currentIndex.toString());
        }

        function updateStats() {
            const matched = Object.keys(matches).length;
            const skippedCount = skipped.size;
            const remaining = gameData.length - matched - skippedCount;

            document.getElementById('matched-count').textContent = matched;
            document.getElementById('skipped-count').textContent = skippedCount;
            document.getElementById('remaining-count').textContent = remaining;

            const progress = ((matched + skippedCount) / gameData.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent =
                `${matched + skippedCount} / ${gameData.length}`;
        }

        function renderCurrentCard() {
            const container = document.getElementById('game-container');

            // Find next unprocessed sprite
            while (currentIndex < gameData.length) {
                const item = gameData[currentIndex];
                if (!matches[item.sprite.filename] && !skipped.has(item.sprite.filename)) {
                    break;
                }
                currentIndex++;
            }

            if (currentIndex >= gameData.length) {
                container.innerHTML = `
                    <div class="completed">
                        <h2>🎉 All Done!</h2>
                        <p>You've processed all ${gameData.length} sprites.</p>
                        <p style="margin-top: 20px; color: #888;">
                            Matched: ${Object.keys(matches).length} |
                            Skipped: ${skipped.size}
                        </p>
                        <button class="primary" style="margin-top: 30px; padding: 15px 30px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; background: #4CAF50; color: white;" onclick="exportMatches()">
                            Export Matches
                        </button>
                    </div>
                `;
                updateStats();
                return;
            }

            const item = gameData[currentIndex];
            selectedMatch = null;

            // Calculate confidence bars (inverse of score, normalized)
            const maxScore = Math.max(...item.matches.map(m => m.score));

            let matchesHTML = item.matches.map((m, idx) => {
                const confidence = Math.max(0, 100 - (m.score * 2));
                return `
                    <div class="match-option animate" onclick="selectMatch(${idx}, '${m.name}')" id="match-${idx}" style="animation-delay: ${idx * 0.03}s">
                        <img src="file://${m.path}" loading="lazy">
                        <div class="name">${m.name}</div>
                        <div class="score">Score: ${m.score}</div>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${confidence}%"></div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="match-card">
                    <div class="sprite-section">
                        <h3>EXTRACTED SPRITE (${currentIndex + 1} of ${gameData.length})</h3>
                        <div class="sprite-preview animate">
                            <img src="file://${item.sprite.path}">
                        </div>
                        <div class="sprite-info">
                            ${item.sprite.filename}<br>
                            ${item.sprite.size[0]}x${item.sprite.size[1]}px
                        </div>
                    </div>

                    <div class="matches-section">
                        <h3>SELECT THE BEST MATCH</h3>
                        <div class="matches-grid">
                            ${matchesHTML}
                            <div class="no-match-btn" onclick="selectNoMatch()">
                                ❌ No Match / Skip
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="skip" onclick="skipSprite()">Skip for Later</button>
                        <button class="confirm" id="confirm-btn" onclick="confirmMatch()" disabled>
                            Confirm Match
                        </button>
                    </div>
                </div>
            `;

            updateStats();
        }

        function selectMatch(idx, name) {
            // Deselect all
            document.querySelectorAll('.match-option').forEach(el => {
                el.classList.remove('selected');
            });

            // Select this one
            document.getElementById(`match-${idx}`).classList.add('selected');
            selectedMatch = name;

            document.getElementById('confirm-btn').disabled = false;
        }

        function selectNoMatch() {
            selectedMatch = '__SKIP__';
            document.querySelectorAll('.match-option').forEach(el => {
                el.classList.remove('selected');
            });
            document.getElementById('confirm-btn').disabled = false;
            document.getElementById('confirm-btn').textContent = 'Confirm Skip';
        }

        function confirmMatch() {
            const item = gameData[currentIndex];

            // Save to history for go-back
            history.push(currentIndex);

            if (selectedMatch === '__SKIP__') {
                skipped.add(item.sprite.filename);
            } else if (selectedMatch) {
                matches[item.sprite.filename] = selectedMatch;
            }

            currentIndex++;
            saveState();
            renderCurrentCard();
        }

        function skipSprite() {
            currentIndex++;
            saveState();
            renderCurrentCard();
        }

        function jumpToUnmatched() {
            currentIndex = 0;
            renderCurrentCard();
        }

        // History for go-back functionality
        let history = [];

        function goBack() {
            // First try session history
            if (history.length > 0) {
                const prevIndex = history.pop();
                const prevItem = gameData[prevIndex];
                // Undo the match/skip for that item
                if (prevItem) {
                    delete matches[prevItem.sprite.filename];
                    skipped.delete(prevItem.sprite.filename);
                }
                currentIndex = prevIndex;
                saveState();
                renderCurrentCard();
                return;
            }

            // Otherwise, find the previous processed item before currentIndex
            for (let i = currentIndex - 1; i >= 0; i--) {
                const item = gameData[i];
                if (matches[item.sprite.filename] || skipped.has(item.sprite.filename)) {
                    // Found a previously processed item - undo it
                    delete matches[item.sprite.filename];
                    skipped.delete(item.sprite.filename);
                    currentIndex = i;
                    saveState();
                    renderCurrentCard();
                    return;
                }
            }
        }

        function exportMatches() {
            document.getElementById('modal-title').textContent = 'Matched Sprites (JSON)';
            document.getElementById('export-text').value = JSON.stringify(matches, null, 2);
            document.getElementById('export-modal').classList.add('active');
        }

        function exportRenameScript() {
            let script = '#!/bin/bash\n';
            script += '# Rename matched sprites\n';
            script += '# Run from the extracted sprites directory\n\n';

            for (const [original, newName] of Object.entries(matches)) {
                script += `mv "${original}" "${newName}.png"\n`;
            }

            document.getElementById('modal-title').textContent = 'Rename Script (Bash)';
            document.getElementById('export-text').value = script;
            document.getElementById('export-modal').classList.add('active');
        }

        function copyExport() {
            const text = document.getElementById('export-text');
            text.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        function closeModal() {
            document.getElementById('export-modal').classList.remove('active');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ignore if modal is open
            if (document.getElementById('export-modal').classList.contains('active')) {
                if (e.key === 'Escape') closeModal();
                return;
            }

            if (e.key >= '1' && e.key <= '6') {
                e.preventDefault();
                const idx = parseInt(e.key) - 1;
                const item = gameData[currentIndex];
                if (item && item.matches[idx]) {
                    // Select and immediately confirm
                    selectMatch(idx, item.matches[idx].name);
                    confirmMatch();
                }
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                // Spacebar = skip/no match + submit
                e.preventDefault();
                selectNoMatch();
                confirmMatch();
            } else if (e.key === 'Enter' && selectedMatch) {
                e.preventDefault();
                confirmMatch();
            } else if (e.key === 's' || e.key === 'S') {
                // S = skip without marking as no-match (can revisit later)
                e.preventDefault();
                skipSprite();
            } else if (e.key === 'b' || e.key === 'B') {
                // B = go back to previous
                e.preventDefault();
                goBack();
            }
        });

        // Start
        renderCurrentCard();
    </script>
